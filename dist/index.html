<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}body{margin:0}</style><title>CRID Portföy Takibi</title>
<meta name="description" content="Cost Reduction Ideas Database — maliyet azaltma fikirleri, bütçe ve proje takip sistemi">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>/* CRID — maliyet azaltma portföyü. Düzen: koyu lacivert yan menü + yoğun veri yüzeyleri.
   Renk dili mevcut Excel çalışmalarından: lacivert başlık, yeşil = gerçekleşen, gri = planlanan, kırmızı = hedef/gecikme. */
:root {
  --bg: #eef1f5;
  --surface: #ffffff;
  --surface-2: #f6f8fb;
  --surface-3: #e9edf3;
  --line: #d9dfe8;
  --line-strong: #c3ccd9;
  --text: #172033;
  --muted: #5b6577;
  --faint: #8a93a3;
  --ink: #13254b;
  --ink-2: #1c3466;
  --ink-text: #e9eef8;
  --ink-muted: #9fb0d0;
  --accent: #1f55b8;
  --accent-soft: #e4ecfa;
  --good: #3f9142;
  --good-soft: #e3f2e2;
  --plan: #b5bdca;
  --plan-soft: #eef0f4;
  --target: #c8102e;
  --bad: #c8102e;
  --bad-soft: #fbe5e8;
  --warn: #b97f00;
  --warn-soft: #fbf0d6;
  --info: #2f6fb3;
  --info-soft: #e3eef9;
  --done: #4b5d80;
  --done-soft: #e6eaf2;
  --shadow: 0 1px 2px rgba(19, 37, 75, .06), 0 2px 8px rgba(19, 37, 75, .05);
  --font-display: "Barlow Semi Condensed", "Arial Narrow", "Segoe UI", system-ui, sans-serif;
  --font-body: "Barlow", "Segoe UI", system-ui, -apple-system, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --radius: 6px;
  --side-w: 236px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1320; --surface: #161d2b; --surface-2: #1b2334; --surface-3: #232d41; --line: #2a3448; --line-strong: #39455c;
    --text: #e4e9f2; --muted: #a0aabb; --faint: #737e92; --ink: #0a1122; --ink-2: #16213b; --ink-text: #e4e9f2; --ink-muted: #8d9cbb;
    --accent: #6f9bff; --accent-soft: #1d2b4a; --good: #5cb860; --good-soft: #193323; --plan: #56627a; --plan-soft: #222b3b;
    --target: #ff5b6b; --bad: #ff5b6b; --bad-soft: #3a1c24; --warn: #e5b345; --warn-soft: #3a2f15; --info: #74a8e6; --info-soft: #1a2a40;
    --done: #a3b2d1; --done-soft: #232c40; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1320; --surface: #161d2b; --surface-2: #1b2334; --surface-3: #232d41; --line: #2a3448; --line-strong: #39455c;
  --text: #e4e9f2; --muted: #a0aabb; --faint: #737e92; --ink: #0a1122; --ink-2: #16213b; --ink-text: #e4e9f2; --ink-muted: #8d9cbb;
  --accent: #6f9bff; --accent-soft: #1d2b4a; --good: #5cb860; --good-soft: #193323; --plan: #56627a; --plan-soft: #222b3b;
  --target: #ff5b6b; --bad: #ff5b6b; --bad-soft: #3a1c24; --warn: #e5b345; --warn-soft: #3a2f15; --info: #74a8e6; --info-soft: #1a2a40;
  --done: #a3b2d1; --done-soft: #232c40; --shadow: 0 1px 2px rgba(0, 0, 0, .3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--text); font-family: var(--font-body); font-size: 14px; line-height: 1.45; }
#root { min-height: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { font-family: var(--font-display); margin: 0; text-wrap: balance; letter-spacing: .01em; }
h1 { font-size: 26px; font-weight: 600; }
h2 { font-size: 19px; font-weight: 600; }
h3 { font-size: 16px; font-weight: 600; }
a { color: var(--accent); }
.mono { font-family: var(--font-mono); font-size: .92em; }
.ico { width: 1em; height: 1em; vertical-align: -2px; flex: none; }
.tbl .mono { white-space: nowrap; }
.pill .ico { margin-left: -2px; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.small { font-size: 12px; }
.nowrap { white-space: nowrap; }
.good-t { color: var(--good); } .bad-t { color: var(--bad); } .warn-t { color: var(--warn); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- kabuk ---------- */
.shell { display: grid; grid-template-columns: var(--side-w) minmax(0, 1fr); min-height: 100vh; }
.side { background: var(--ink); color: var(--ink-text); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; padding-bottom: 16px; }
.brand { padding: 18px 18px 14px; border-bottom: 1px solid rgba(255,255,255,.08); }
.brand-mark { font-family: var(--font-display); font-weight: 700; font-size: 26px; letter-spacing: .08em; display: flex; align-items: baseline; gap: 8px; }
.brand-mark span { display: inline-block; width: 10px; height: 10px; background: var(--good); border-radius: 2px; transform: translateY(-2px); }
.brand-sub { font-size: 11.5px; color: var(--ink-muted); letter-spacing: .02em; margin-top: 2px; }
.nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 1px; }
.nav-group { font-size: 10.5px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-muted); padding: 14px 10px 6px; }
.nav button { all: unset; cursor: pointer; display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 5px; color: var(--ink-text); font-size: 14px; }
.nav button:hover { background: rgba(255,255,255,.07); }
.nav button.on { background: rgba(255,255,255,.12); box-shadow: inset 3px 0 0 var(--good); }
.nav button:focus-visible { outline: 2px solid #9db8ff; }
.nav .ico { width: 18px; height: 18px; opacity: .85; flex: none; }
.nav .count { margin-left: auto; font-size: 11px; background: var(--bad); color: #fff; border-radius: 9px; padding: 0 6px; line-height: 17px; }
.side-foot { margin-top: auto; padding: 12px 16px 0; font-size: 11.5px; color: var(--ink-muted); }
.main { min-width: 0; display: flex; flex-direction: column; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px; padding: 8px 20px; min-height: 54px; }
.topbar .search { flex: 1; max-width: 520px; position: relative; }
.topbar .search input { width: 100%; padding: 8px 12px 8px 34px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface-2); }
.topbar .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--faint); }
.search-pop { position: absolute; top: calc(100% + 4px); left: 0; right: 0; background: var(--surface); border: 1px solid var(--line); border-radius: 6px; box-shadow: 0 8px 28px rgba(0,0,0,.18); max-height: 60vh; overflow: auto; z-index: 40; }
.search-pop button { all: unset; display: flex; gap: 10px; width: 100%; box-sizing: border-box; padding: 8px 12px; cursor: pointer; border-bottom: 1px solid var(--line); }
.search-pop button:hover, .search-pop button.hl { background: var(--accent-soft); }
.top-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; }
.menu-btn { display: none; }
.content { padding: 20px; padding-block: 20px 40px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.page-head { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-head .grow { flex: 1; min-width: 200px; }
.eyebrow { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--muted); font-weight: 600; }
.banner { padding: 9px 14px; border-radius: var(--radius); font-size: 13px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.banner.info { background: var(--info-soft); color: var(--text); border: 1px solid color-mix(in srgb, var(--info) 30%, transparent); }
.banner.warn { background: var(--warn-soft); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); }
.banner.bad { background: var(--bad-soft); border: 1px solid color-mix(in srgb, var(--bad) 35%, transparent); }

/* ---------- yüzeyler ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); min-width: 0; }
.card-h { display: flex; align-items: center; gap: 10px; padding: 12px 16px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
.card-h h3 { flex: 1; min-width: 140px; }
.card-b { padding: 14px 16px; min-width: 0; }
.card-b.flush { padding: 0; }
.grid { display: grid; gap: 16px; min-width: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g-main-side { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.end { justify-content: flex-end; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.spacer { flex: 1; }
hr.sep { border: 0; border-top: 1px solid var(--line); margin: 6px 0; }

/* KPI şeridi */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); }
.kpi { padding: 12px 16px; border-right: 1px solid var(--line); min-width: 0; }
.kpi:last-child { border-right: 0; }
.kpi .l { font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.kpi .v { font-family: var(--font-display); font-size: 26px; font-weight: 600; font-variant-numeric: tabular-nums; line-height: 1.15; margin-top: 2px; }
.kpi .s { font-size: 12px; color: var(--muted); }
.kpi.k-good .v { color: var(--good); } .kpi.k-bad .v { color: var(--bad); } .kpi.k-accent .v { color: var(--accent); }
button.kpi { all: unset; cursor: pointer; padding: 12px 16px; border-right: 1px solid var(--line); }
button.kpi:hover { background: var(--surface-2); }

/* ---------- kontroller ---------- */
.btn { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 5px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-weight: 500; font-size: 13.5px; white-space: nowrap; line-height: 1.2; }
.btn:hover { background: var(--surface-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.primary { background: var(--ink); color: #fff; border-color: var(--ink); }
:root[data-theme="dark"] .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .btn.primary { background: var(--accent); border-color: var(--accent); color: #0b1220; } }
.btn.primary:hover { filter: brightness(1.12); }
.btn.good { background: var(--good); border-color: var(--good); color: #fff; }
.btn.danger { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, var(--line)); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-3); }
.btn.sm { padding: 4px 9px; font-size: 12.5px; }
.btn svg { width: 15px; height: 15px; }
.icon-btn { all: unset; cursor: pointer; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 6px; position: relative; color: var(--muted); }
.icon-btn:hover { background: var(--surface-3); color: var(--text); }
.icon-btn svg { width: 19px; height: 19px; }
.icon-btn .dot { position: absolute; top: 4px; right: 3px; min-width: 16px; height: 16px; border-radius: 8px; background: var(--bad); color: #fff; font-size: 10px; display: grid; place-items: center; padding: 0 4px; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > label, .lbl { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .02em; }
.field .hint { font-size: 11.5px; color: var(--faint); }
.field .err { font-size: 12px; color: var(--bad); }
.inp, select.inp, textarea.inp { width: 100%; padding: 7px 9px; border: 1px solid var(--line-strong); border-radius: 5px; background: var(--surface); min-width: 0; }
.inp:disabled, .inp[readonly] { background: var(--surface-2); color: var(--muted); }
textarea.inp { resize: vertical; min-height: 70px; }
.inp.sm { padding: 4px 6px; font-size: 13px; }
.inp.num-in { text-align: right; font-variant-numeric: tabular-nums; }
.form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px 14px; }
.form-grid .span2 { grid-column: span 2; }
.form-grid .span-all { grid-column: 1 / -1; }
.chk { display: inline-flex; gap: 6px; align-items: center; font-size: 13px; cursor: pointer; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 14px; border: 1px solid var(--line-strong); background: var(--surface); cursor: pointer; font-size: 12.5px; }
.chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
.chip:disabled { cursor: default; opacity: .8; }
.seg { display: inline-flex; border: 1px solid var(--line-strong); border-radius: 5px; overflow: hidden; }
.seg button { all: unset; cursor: pointer; padding: 5px 11px; font-size: 13px; border-right: 1px solid var(--line-strong); }
.seg button:last-child { border-right: 0; }
.seg button.on { background: var(--ink); color: #fff; }
:root[data-theme="dark"] .seg button.on { background: var(--accent); color: #0b1220; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button.on { background: var(--accent); color: #0b1220; } }

/* ---------- rozetler ---------- */
.pill { display: inline-flex; align-items: center; gap: 5px; padding: 1px 8px; border-radius: 11px; font-size: 12px; font-weight: 600; white-space: nowrap; line-height: 19px; border: 1px solid transparent; }
.pill::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; opacity: .9; }
.t-neutral { background: var(--surface-3); color: var(--muted); }
.t-info { background: var(--info-soft); color: var(--info); }
.t-accent { background: var(--accent-soft); color: var(--accent); }
.t-good { background: var(--good-soft); color: var(--good); }
.t-bad { background: var(--bad-soft); color: var(--bad); }
.t-warn { background: var(--warn-soft); color: var(--warn); }
.t-done { background: var(--done-soft); color: var(--done); }
.t-muted { background: transparent; color: var(--faint); border-color: var(--line); text-decoration: line-through; }
.tag { display: inline-block; font-size: 11.5px; padding: 0 6px; border-radius: 3px; background: var(--surface-3); color: var(--muted); line-height: 18px; white-space: nowrap; }
.tag.sample { background: var(--warn-soft); color: var(--warn); font-weight: 600; }
.ms-date { font-variant-numeric: tabular-nums; white-space: nowrap; font-weight: 600; }
.ms-done_ontime { color: var(--good); } .ms-done_late { color: var(--warn); } .ms-overdue { color: var(--bad); }
.ms-upcoming { color: var(--accent); } .ms-planned { color: var(--text); } .ms-none, .ms-na { color: var(--faint); }

/* ---------- tablolar ---------- */
.tbl-wrap { overflow-x: auto; max-width: 100%; }
table.tbl { width: 100%; border-collapse: separate; border-spacing: 0; font-size: 13px; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 600; font-size: 11.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; z-index: 1; }
.tbl th.sortable { cursor: pointer; user-select: none; }
.tbl th.sortable:hover { color: var(--text); }
.tbl td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tr.click { cursor: pointer; }
.tbl tr.late td:first-child { box-shadow: inset 3px 0 0 var(--bad); }
.tbl tr.cancel td { color: var(--faint); }
.tbl tr.cancel td .t-title { text-decoration: line-through; }
.tbl tr.grp td { background: var(--surface-3); font-weight: 600; font-size: 12.5px; }
.tbl tr.tot td { background: var(--surface-2); font-weight: 700; border-top: 2px solid var(--line-strong); }
.tbl td.t-title { min-width: 220px; max-width: 380px; }
.tbl .t-title b { font-weight: 600; }
.tbl input.inp.sm { min-width: 64px; }
.tbl .num { text-align: right; }
.tbl th.num { text-align: right; }
.empty { padding: 34px 16px; text-align: center; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty b { color: var(--text); font-family: var(--font-display); font-size: 17px; }

/* ---------- filtre çubuğu ---------- */
.filterbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: flex-end; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 12px; }
.filterbar .field { min-width: 128px; flex: 1 1 128px; max-width: 200px; }
.filterbar .field select { padding: 5px 7px; font-size: 13px; }

/* ---------- sekmeler ---------- */
.tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--line); overflow-x: auto; }
.tabs button { all: unset; cursor: pointer; padding: 9px 14px; font-weight: 600; font-size: 13.5px; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
.tabs button.on { color: var(--text); border-bottom-color: var(--ink); }
:root[data-theme="dark"] .tabs button.on { border-bottom-color: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tabs button.on { border-bottom-color: var(--accent); } }
.tabs button .c { font-size: 11px; background: var(--surface-3); border-radius: 8px; padding: 0 6px; margin-left: 4px; }

/* ---------- modal / çekmece ---------- */
.overlay { position: fixed; inset: 0; background: rgba(10, 16, 30, .45); z-index: 60; display: flex; justify-content: center; align-items: flex-start; padding: 5vh 16px; overflow-y: auto; }
.modal { background: var(--surface); border-radius: 8px; width: min(760px, 100%); box-shadow: 0 20px 60px rgba(0,0,0,.3); display: flex; flex-direction: column; max-height: 90vh; }
.modal.wide { width: min(1080px, 100%); }
.modal.narrow { width: min(460px, 100%); }
.modal-h { padding: 14px 18px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 10px; }
.modal-h h2 { flex: 1; }
.modal-b { padding: 16px 18px; overflow-y: auto; }
.modal-f { padding: 12px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
.toasts { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); right: 16px; z-index: 80; display: flex; flex-direction: column; gap: 8px; max-width: min(420px, calc(100vw - 32px)); }
.toast { background: var(--ink); color: #fff; padding: 10px 14px; border-radius: 6px; box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: 13.5px; }
.toast.bad { background: var(--bad); }
.toast.good { background: #2f7a33; }

/* ---------- CRID detay ---------- */
.rec-head { display: flex; gap: 14px; align-items: flex-start; flex-wrap: wrap; }
.rec-no { font-family: var(--font-mono); font-size: 13px; color: var(--muted); }
.rec-title { font-family: var(--font-display); font-size: 25px; font-weight: 600; line-height: 1.15; }
.kv { display: grid; grid-template-columns: minmax(130px, 38%) minmax(0, 1fr); gap: 6px 12px; font-size: 13.5px; }
.kv > div:nth-child(odd) { color: var(--muted); }
.ms-track { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 0; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.ms-cell { padding: 12px 14px; border-right: 1px solid var(--line); min-width: 0; position: relative; }
.ms-cell:last-child { border-right: 0; }
.ms-cell .k { font-family: var(--font-display); font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.ms-cell .k .m { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.ms-cell .bar { position: absolute; left: 0; top: 0; right: 0; height: 3px; }
.ms-cell.s-done_ontime .bar, .ms-cell.s-confirmed .bar { background: var(--good); }
.ms-cell.s-done_late .bar { background: var(--warn); }
.ms-cell.s-overdue .bar { background: var(--bad); }
.ms-cell.s-upcoming .bar { background: var(--accent); }
.ms-cell.s-planned .bar, .ms-cell.s-pending .bar { background: var(--plan); }

/* Araç kartı (referans görsel 1) */
.veh-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 14px; }
.veh { border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); padding: 14px 16px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; text-align: left; min-width: 0; }
.veh:hover { border-color: var(--line-strong); box-shadow: var(--shadow); }
.veh-top { display: flex; align-items: baseline; gap: 8px; }
.veh-name { font-family: var(--font-display); font-weight: 600; font-size: 18px; text-transform: uppercase; letter-spacing: .04em; }
.veh-bar { position: relative; height: 46px; background: var(--surface-2); border-radius: 3px; margin-top: 18px; }
.veh-bar .pot { position: absolute; left: 0; top: 0; bottom: 0; background: var(--plan); border-radius: 3px; overflow: hidden; }
.veh-bar .real { position: absolute; left: 0; top: 0; bottom: 0; background: var(--good); display: flex; align-items: center; padding-left: 10px; color: #fff; font-weight: 700; font-size: 13px; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; }
.veh-bar .rest { position: absolute; top: 50%; transform: translateY(-50%); font-weight: 600; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; background: var(--surface); padding: 0 4px; border-radius: 3px; z-index: 1; }
.veh-bar .mark { position: absolute; top: -16px; bottom: -6px; border-left: 2px dashed var(--target); }
.veh-bar .mark i { position: absolute; top: -2px; left: -6px; width: 10px; height: 10px; border-radius: 50%; background: var(--target); box-shadow: 0 0 0 2px var(--surface); }
.veh-bar .mark.now i { background: var(--surface); border: 2px solid var(--target); }
.veh-meta { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.veh-meta div { background: var(--surface-2); border-radius: 4px; padding: 5px 8px; min-width: 0; }
.veh-meta .l { font-size: 10.5px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; }
.veh-meta .v { font-weight: 700; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
.legend i.dash { width: 14px; height: 0; border-top: 2px dashed var(--target); border-radius: 0; vertical-align: 3px; }

/* Gantt (referans görsel 3) */
.gantt td.gm { padding: 0; width: 34px; min-width: 34px; text-align: center; border-left: 1px solid var(--line); position: relative; }
.gantt td.gm.now { background: color-mix(in srgb, var(--target) 7%, transparent); }
.gantt th.gm { text-align: center; padding: 6px 2px; font-size: 10.5px; }
.gantt th.gm.now { color: var(--target); }
.gbox { display: inline-block; width: 11px; height: 11px; border-radius: 2px; vertical-align: middle; }
.gbox.plan { border: 2px solid var(--ink); background: transparent; }
:root[data-theme="dark"] .gbox.plan { border-color: var(--text); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .gbox.plan { border-color: var(--text); } }
.gbox.done { background: var(--good); }
.gbox.late { background: var(--bad); }
.gbox.warnb { background: var(--warn); }
.gbox.cancel { background: transparent; border: 2px solid var(--faint); }

/* grafikler */
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font-body); }
.chart .axis line, .chart .grid line { stroke: var(--line); }
.chart .lbl-strong { fill: var(--text); font-weight: 700; }
.chart-tip { position: fixed; pointer-events: none; background: var(--ink); color: #fff; padding: 6px 9px; border-radius: 5px; font-size: 12px; z-index: 90; white-space: nowrap; }

.progress { height: 8px; background: var(--surface-3); border-radius: 4px; overflow: hidden; min-width: 60px; }
.progress > i { display: block; height: 100%; background: var(--good); }
.progress.bad > i { background: var(--bad); }

.month-dots { display: grid; grid-template-columns: repeat(12, 1fr); gap: 2px; min-width: 180px; }
.month-dots span { height: 10px; border-radius: 2px; background: var(--surface-3); }
.month-dots span.on { background: var(--ink); }
:root[data-theme="dark"] .month-dots span.on { background: var(--accent); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .month-dots span.on { background: var(--accent); } }

.drop { border: 1.5px dashed var(--line-strong); border-radius: var(--radius); padding: 16px; text-align: center; color: var(--muted); }
.drop.over { border-color: var(--accent); background: var(--accent-soft); }
.list-plain { list-style: none; margin: 0; padding: 0; }
.list-plain li { padding: 8px 0; border-bottom: 1px solid var(--line); display: flex; gap: 10px; align-items: flex-start; }
.list-plain li:last-child { border-bottom: 0; }
.sev { width: 8px; height: 8px; border-radius: 50%; margin-top: 6px; flex: none; }
.sev.bad { background: var(--bad); } .sev.warn { background: var(--warn); } .sev.info { background: var(--info); } .sev.good { background: var(--good); }
.hist-item { border-left: 2px solid var(--line-strong); padding: 2px 0 10px 12px; position: relative; }
.hist-item::before { content: ""; position: absolute; left: -5px; top: 6px; width: 8px; height: 8px; border-radius: 50%; background: var(--surface); border: 2px solid var(--ink); }
.diff { font-size: 12.5px; color: var(--muted); }
.diff b { color: var(--text); font-weight: 600; }
.diff s { color: var(--faint); }
.loading { display: grid; place-items: center; min-height: 60vh; color: var(--muted); gap: 10px; text-align: center; }
.spin { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--ink); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 3s; } }

.perm-grid th, .perm-grid td { text-align: center; }
.perm-grid td:first-child, .perm-grid th:first-child { text-align: left; }

/* ---------- duyarlı ---------- */
@media (max-width: 1100px) {
  .g3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .g-main-side { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 860px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .side { position: fixed; left: 0; top: 0; bottom: 0; width: min(280px, 85vw); z-index: 70; transform: translateX(-100%); transition: transform .2s; padding-top: env(safe-area-inset-top, 0px); }
  .side.open { transform: none; box-shadow: 0 0 40px rgba(0,0,0,.4); }
  .menu-btn { display: grid; }
  .g2, .g3 { grid-template-columns: minmax(0, 1fr); }
  .content { padding: 16px; padding-block: 16px 32px; }
  .topbar { padding: 8px 12px; }
  .ms-track { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .ms-cell:nth-child(2) { border-right: 0; }
  .ms-cell:nth-child(-n+2) { border-bottom: 1px solid var(--line); }
  .form-grid .span2 { grid-column: 1 / -1; }
  .kpi { border-bottom: 1px solid var(--line); }
}
@media (max-width: 520px) {
  .topbar .who-name, .topbar .pill { display: none; }
  .veh-grid { grid-template-columns: minmax(0, 1fr); }
  .rec-title { font-size: 21px; }
  h1 { font-size: 22px; }
}

/* ---------- giriş ---------- */
.login-wrap { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); }
.login-card { width: min(420px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; box-shadow: 0 10px 40px rgba(19, 37, 75, .12); }
.login-brand { background: var(--ink); color: var(--ink-text); padding: 22px 24px 18px; }
.login-brand .brand-sub { color: var(--ink-muted); }
.login-body { padding: 22px 24px 24px; display: flex; flex-direction: column; gap: 14px; }

/* ---------- kurumsal görünüm ---------- */
.logo-strip { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: #fff; border-radius: 6px; padding: 8px 10px; margin-top: 12px; }
.logo-strip img { max-height: 30px; max-width: 46%; width: auto; object-fit: contain; }
.login-brand .logo-strip { margin-top: 14px; }
.login-brand .logo-strip img { max-height: 40px; }
.main { position: relative; isolation: isolate; }
.watermark { position: fixed; inset: 0 0 0 var(--side-w); z-index: -1; pointer-events: none; overflow: hidden; }
.watermark .wm-inner { position: absolute; inset: -30% -20%; display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--wm-size), 1fr)); gap: calc(var(--wm-size) * .35) calc(var(--wm-size) * .3); align-content: start; justify-items: center; transform: rotate(-16deg); opacity: var(--wm-opacity); filter: grayscale(1); }
.watermark img { width: calc(var(--wm-size) * .72); height: calc(var(--wm-size) * .32); object-fit: contain; }
:root[data-theme="dark"] .watermark .wm-inner { filter: grayscale(1) invert(1); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .watermark .wm-inner { filter: grayscale(1) invert(1); } }
.login-wrap { position: relative; isolation: isolate; }
.login-wrap .watermark { inset: 0; }
@media (max-width: 860px) { .watermark { inset: 0; } }
.brand-preview { border: 1px dashed var(--line-strong); border-radius: var(--radius); padding: 14px; background: var(--bg); position: relative; min-height: 220px; overflow: hidden; isolation: isolate; }
.brand-preview .watermark { position: absolute; inset: 0; }
